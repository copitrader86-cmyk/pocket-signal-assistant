name: Render deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy and verify Pocket Signal Assistant
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SERVER_BASE_URL: ${{ vars.SERVER_BASE_URL || 'https://pocket-signal-assistant.onrender.com' }}
    steps:
      - name: Trigger Render deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RENDER_API_KEY" ]] || {
            echo "::error::Missing GitHub secret: RENDER_API_KEY"
            exit 1
          }
          [[ -n "$RENDER_SERVICE_ID" ]] || {
            echo "::error::Missing GitHub secret: RENDER_SERVICE_ID"
            exit 1
          }
          [[ "$SERVER_BASE_URL" == https://* ]] || {
            echo "::error::SERVER_BASE_URL must use HTTPS"
            exit 1
          }

          deploy_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          response_file="$RUNNER_TEMP/render-deploy.json"
          deploy_request="$(jq -nc --arg commit_id "$GITHUB_SHA" \
            '{clearCache:"do_not_clear",commitId:$commit_id}')"
          http_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' --max-time 30 \
            --request POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$deploy_request")" || {
              echo "::error::Could not contact the Render deploy API"
              exit 1
            }
          if [[ "$http_status" != 2* ]]; then
            echo "::error::Render rejected the deployment request (HTTP $http_status)"
            api_error="$(jq -r '.message // .error // .errors[0].message // empty' \
              "$response_file" 2>/dev/null || true)"
            if [[ -n "$api_error" ]]; then
              echo "::error::Render API reason: $api_error"
            fi
            exit 1
          fi

          deploy_id="$(jq -r '.id // .deploy.id // empty' \
            "$response_file" 2>/dev/null || true)"
          if [[ -z "$deploy_id" ]]; then
            deploy_list_file="$RUNNER_TEMP/render-deploy-list.json"
            deadline=$((SECONDS + 120))
            while (( SECONDS < deadline )); do
              list_status="$(curl --silent --show-error --output "$deploy_list_file" \
                --write-out '%{http_code}' --max-time 30 \
                --get \
                --data-urlencode "createdAfter=$deploy_started_at" \
                --data-urlencode "limit=20" \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")" || {
                  echo "::error::Could not find the queued Render deployment"
                  exit 1
                }
              if [[ "$list_status" != 2* ]]; then
                echo "::error::Render deploy list request failed (HTTP $list_status)"
                exit 1
              fi
              deploy_id="$(jq -r --arg commit_id "$GITHUB_SHA" \
                '[.[] | .deploy | select(.commit.id == $commit_id)] | first | .id // empty' \
                "$deploy_list_file")"
              [[ -n "$deploy_id" ]] && break
              sleep 5
            done
          fi
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render accepted the deploy request but returned no deployment ID"
            exit 1
          fi

          echo "Render accepted deployment $deploy_id"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_id="${{ steps.deploy.outputs.deploy_id }}"
          deploy_file="$RUNNER_TEMP/render-deploy-status.json"
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            http_status="$(curl --silent --show-error --output "$deploy_file" \
              --write-out '%{http_code}' --max-time 30 \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}")" || {
                echo "::error::Could not query Render deployment status"
                exit 1
              }
            if [[ "$http_status" != 2* ]]; then
              echo "::error::Render status request failed (HTTP $http_status)"
              exit 1
            fi

            status="$(jq -r '.status // .deploy.status // "unknown"' "$deploy_file")"
            echo "Render deployment status: $status"
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment ended with status: $status"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for Render deployment to become live"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WebSocket check dependency
        run: python -m pip install --disable-pip-version-check "websockets>=14,<16"

      - name: Verify production backend
        shell: bash
        run: |
          set -uo pipefail
          set +e
          failures=0
          response_file="$RUNNER_TEMP/production-check.json"

          check_http() {
            local label="$1"
            local method="$2"
            local path="$3"
            local expected_status="$4"
            local http_status

            if ! http_status="$(curl --silent --show-error --output "$response_file" \
              --write-out '%{http_code}' --max-time 90 \
              --request "$method" "${SERVER_BASE_URL}${path}")"; then
              echo "::error::$label request failed before receiving an HTTP response"
              failures=1
              return 1
            fi

            if [[ "$http_status" != "$expected_status" ]]; then
              local details
              details="$(head -c 500 "$response_file" | tr '\n' ' ')"
              echo "::error::$label failed (HTTP $http_status): $details"
              failures=1
              return 1
            fi

            echo "$label passed (HTTP $http_status)"
            return 0
          }

          if check_http "GET /health" GET "/health" 200; then
            if ! jq -e '.status == "ok"' "$response_file" >/dev/null; then
              echo "::error::Health endpoint returned an unexpected response"
              failures=1
            fi
          fi

          if check_http "GET /api/v1/sources/status" GET "/api/v1/sources/status" 200; then
            jq -e '.online | has("credentials_configured")' "$response_file" >/dev/null || {
              echo "::error::Source status returned an unexpected response"
              failures=1
            }
          fi

          if check_http "GET instrument catalog" GET "/api/v1/catalog" 200; then
            if ! jq -e '
              (.instruments | type == "array") and
              (.classic_available | type == "boolean") and
              (.otc_available | type == "boolean")
            ' "$response_file" >/dev/null; then
              echo "::error::Instrument catalog returned an unexpected response"
              failures=1
            fi
          fi

          if python - "${SERVER_BASE_URL}" <<'PY'
          import asyncio
          import sys
          from urllib.parse import quote, urlsplit, urlunsplit

          import websockets

          async def check_websocket(base_url: str) -> None:
              parsed = urlsplit(base_url)
              websocket_url = urlunsplit(
                  (
                      "wss" if parsed.scheme == "https" else "ws",
                      parsed.netloc,
                      "/api/v1/stream",
                      "symbol=" + quote("EUR/USD", safe=""),
                      "",
                  )
              )
              async with websockets.connect(
                  websocket_url, open_timeout=15, close_timeout=5
              ):
                  print("WebSocket handshake passed")

          try:
              asyncio.run(check_websocket(sys.argv[1]))
          except Exception as error:
              print(
                  f"::error::WebSocket check failed ({type(error).__name__}): {error}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
          then
            :
          else
            failures=1
          fi

          if (( failures != 0 )); then
            echo "::error::One or more production backend checks failed"
            exit 1
          fi
