services:
  - type: web
    name: pocket-signal-assistant
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/pocket-signal/signals.db
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TWELVE_DATA_API_KEY
        sync: false
